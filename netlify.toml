[build]
  # Deploys Convex functions first when CONVEX_DEPLOY_KEY is set in Netlify; otherwise a plain build (on-device mode).
  command = "npm run build:ci"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let React Router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch the newest service worker so updates reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
